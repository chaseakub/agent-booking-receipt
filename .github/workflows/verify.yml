name: Verify booking recovery
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: python -m pip install '.[demo]'
      - run: python -m unittest discover -s tests -v
      - name: Lose the response after a real calendar saves a booking
        run: booking-receipt demo
      - name: Verify free availability in the installed CLI
        run: |
          booking-receipt offer | jq -e '(.free.amount == 0) and (.free.license == "MIT") and (.paid.availability == "unavailable") and (.paid.checkout_url == null) and (.paid.human_url == null)'
      - name: Install the agent skill into an empty project
        working-directory: ${{ runner.temp }}
        env:
          DISABLE_TELEMETRY: '1'
        run: |
          mkdir booking-skill-consumer && cd booking-skill-consumer
          npx --yes skills@1.9.0 add "$GITHUB_WORKSPACE" --skill booking-receipt --agent codex -y
          cmp "$GITHUB_WORKSPACE/skills/booking-receipt/SKILL.md" .agents/skills/booking-receipt/SKILL.md
